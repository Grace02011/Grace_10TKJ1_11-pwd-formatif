
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        #top {
            background-color: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .card {
            position: relative;
            width: 360px;
            margin: 30px auto;
            border: 1px solid #ccc;
            background-color: white;
            padding: 15px;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgb(195, 182, 158);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .card h3 {
            color: #222;
        }

        .card p {
            font-size: 15px;
        }

        main p {
            width: 360px;
            margin: 20px auto;
            line-height: 1.6;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        .back-to-top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: #8191a3;
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            border-radius: 5px;
            z-index: 1000;
        }

        .back-to-top:hover {
            background-color: #4c5560;
        }
    </style>
</head>

<body>

    <header id="top">
        <h1>Proyek Saya</h1>
    </header>

    <main>

        <div class="card">
            <span class="badge">BARU</span>

            <img src="../assets/proyek.jpg" alt="Gambar Proyek Saya">

            <h3>Website Portofolio</h3>

            <p>
                PR
            </p>
        </div>

        <p>
            HTML.
        </p>

        <p>
            CSS.
        </p>

        <p>
            Formatif
        </p>

        <p>
            Bikin nangis
        </p>

        <p>
            Kebanyakan
        </p>

        <p>
            utyrtryujtkiluytrg
        </p>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

    <a href="#top" class="back-to-top">Atas</a>

</body>
</html>

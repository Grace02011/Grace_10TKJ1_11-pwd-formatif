<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        /* Mengatur halaman */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        /* Judul halaman */
        h1 {
            text-align: center;
            color: rgb(137, 137, 179);
        }

        /* Tempat kartu */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        /* Desain kartu */
        .card {
            background-color: white;
            width: 250px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        /* Judul kartu */
        .card h2 {
            color: rgb(143, 143, 196);
        }

        /* Deskripsi kartu */
        .card p {
            color: #555;
        }

        /* Tombol kartu */
        .card a {
            display: inline-block;
            background-color: rgb(162, 162, 196);
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin-top: 10px;
        }

        .card a:hover {
            background-color: rgb(79, 79, 118);
        }
    </style>
</head>

<body>

    <h1>Proyek Saya</h1>

    <div class="container">

        <div class="card">
            <h2>Proyek 1</h2>
            <p>Proyek 1.</p>
            <a href="#">Lihat</a>
        </div>

        <div class="card">
            <h2>Proyek 2</h2>
            <p>Proyek 2.</p>
            <a href="#">Lihat</a>
        </div>

        <div class="card">
            <h2>Proyek 3</h2>
            <p>Proyek 3.</p>
            <a href="#">Lihatk</a>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>

    <style>
        /* Pengaturan halaman */
        body {
            font-family: Arial, sans-serif;
            background-color: #e4d1d1;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        /* Judul */
        h2 {
            color: #493b3b;
            margin-bottom: 10px;
        }

        p {
            color: #423c3c;
            margin-bottom: 30px;
        }

        /* Tempat kumpulan tombol */
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Desain dasar tombol */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            outline: white 2px;
        }

        /* Tombol 1 */
        .btn-proyek {
            background-color: rgb(163, 149, 174);
            color: white;
        }

        .btn-proyek:hover {
            background-color: rgba(112, 65, 90);
        }

        /* Tombol 2*/
        .btn-unduh {
            background-color: #6c757d;
            color: white;
        }

        .btn-unduh:hover {
            background-color: #545b62;
        }

        /* Tombol 3*/
        .btn-hubungi {
            background-color: #8da993;
            color: white;
        }

        .btn-hubungi:hover {
            background-color: #4b5b4e;
        }

        /* Tombol 4*/
        .btn-pesan {
            background-color: #9d9783;
            color: #212529;
        }

        .btn-pesan:hover {
            background-color: #59564c;
        }

        /* Efek saat tombol ditekan */
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
<main>
    <h1>Kumpulan Tombol</h1>
    <p>Berbagai jenis tombol dengan warna dan efek berbeda.</p>

    <div class="button-container">

        <a href="#proyek" class="btn btn-proyek">Proyek</a>

        <a href="#unduh" class="btn btn-unduh">Unduh CV</a>

        <a href="#hubungi" class="btn btn-hubungi">Hubungi Saya</a>

        <a href="#pesan" class="btn btn-pesan">Kirim Pesan</a>

    </div>
</main>
</body>
</html>

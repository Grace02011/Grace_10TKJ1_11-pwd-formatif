
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak</title>

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            margin: auto;
            padding: 24px;
            border: 1px solid #ccc;
            background-color: white;
            box-sizing: border-box;
        }

        .contact-form h2 {
            text-align: center;
            color: #222;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            background-color: #eef6ff;
            border-color: #8ca7c4;
            outline: none;
        }

        .btn-submit {
            background-color: #5f6c7a;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #737f8d;
        }
    </style>
</head>

<body>

    <section id="contact">

        <form class="contact-form">

            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama"
                       placeholder="Nama">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Email">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5"
                          placeholder="Pesan"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Kirim Pesan
            </button>

        </form>

    </section>

</body>
</html>
